name: url-shortener-dev

# Brings up the whole local stack with one command: `docker compose up
# -d`. The four app services build from the same parameterized
# Dockerfile T5-04 introduced and connect to dynamodb-local/valkey by
# their Compose service names (DYNAMODB_ENDPOINT/VALKEY_ADDR) — not
# localhost, since containers reach each other over the Compose network.
# `docker compose down` tears the whole thing back down; state lives
# only in the (in-memory) dynamodb-local and valkey containers, so
# nothing here persists across a teardown.

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    healthcheck:
      # No -f: DynamoDB Local answers a bare GET with 400 (it expects a
      # signed POST), which is a perfectly healthy response — a plain
      # curl exit code of 0 (connected, got *a* response) is what
      # "healthy" means here, not a 2xx status.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8000/"]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Broad local AWS service emulation (LocalStack Community — the free
  # services, not the Pro-only ones) for whatever future work needs it:
  # ADR-014's outbox path (EventBridge/SQS), a place to exercise the
  # KMS keys and Secrets Manager secret T5-07 created, S3, etc. No
  # application code talks to this yet — cmd/worker (ARC-009) is still
  # an empty scaffold (ADR-005/ADR-014 Deferred), and nothing else in
  # this repo has a use for S3/SQS/EventBridge/Secrets Manager/KMS.
  # This is available ahead of that need, not proof anything consumes
  # it today. Point a real AWS SDK client at it locally with
  # AWS_ENDPOINT_URL=http://localhost:4566 plus any non-empty
  # credentials (LocalStack does not check them).
  #
  # Pinned to 3.8 deliberately, not :latest: the current :latest tag
  # (verified 2026-08-22) refuses to start at all without a paid Pro
  # LOCALSTACK_AUTH_TOKEN ("License activation failed"), even for
  # community-tier services. 3.8.1 starts license-free
  # ("edition": "community" on its own /_localstack/health) and was
  # verified for real against sqs/s3/events/secretsmanager/kms.
  localstack:
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      - DEBUG=0
      - PERSISTENCE=0
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  creation:
    build:
      context: .
      args:
        CMD_PATH: cmd/creation
    ports:
      - "8081:8081"
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
    depends_on:
      dynamodb-local:
        condition: service_healthy

  redirect:
    build:
      context: .
      args:
        CMD_PATH: cmd/redirect
    ports:
      - "8082:8082"
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
    depends_on:
      dynamodb-local:
        condition: service_healthy
    # No Valkey wiring — T8-03 moved cmd/redirect onto a repository-only
    # resolver (internal/application.ResolveUseCase, T8-02); Valkey
    # cache-aside is T9-06's separate, later task, added back on top.
    # The `valkey` service below stays defined (T9-06 will need it),
    # just unused by `redirect` for now.

  admin:
    build:
      context: .
      args:
        CMD_PATH: cmd/admin
    ports:
      - "8083:8083"
    environment:
      # Default (unset) is 127.0.0.1-only, unreachable from the host —
      # correct in a real deployment (T5-05's internal ALB reaches it
      # over its ENI), but useless for local `curl localhost:8083`.
      # Compose is a local dev/test surface, not a production network
      # boundary, so binding all interfaces here is fine.
      ADMIN_ADDR: ":8083"

  worker:
    build:
      context: .
      args:
        CMD_PATH: cmd/worker
